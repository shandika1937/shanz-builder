name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build Identifier'
        required: true
      release_tag:
        description: 'Release Tag with payload.zip'
        required: true
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'
      app_name:
        description: 'Application Name'
        required: false
        default: 'app'
  push:
    branches:
      - 'build/flutter-**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unpack Project Payload & Detect Mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p workspace

          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "📥 Downloading payload.zip from release ${{ inputs.release_tag }}..."
            gh release download "${{ inputs.release_tag }}" --pattern "payload.zip" --dir workspace
          elif [ -f "payload.zip" ]; then
            cp payload.zip workspace/
          fi

          cd workspace
          unzip -q -o payload.zip
          rm -f payload.zip

          if [ ! -f "pubspec.yaml" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving contents from $SUBDIR to workspace root"
              cp -r $SUBDIR/* . 2>/dev/null || true
            fi
          fi
          echo "Files in workspace:"
          ls -la

          TARGET_MODE="${{ inputs.build_type }}"
          if [ -z "$TARGET_MODE" ]; then
            TARGET_MODE="release"
          fi
          echo "TARGET_BUILD_MODE=$TARGET_MODE" >> $GITHUB_ENV

      - name: Compile Flutter APK
        working-directory: workspace
        run: |
          flutter pub get
          if [ "${{ env.TARGET_BUILD_MODE }}" = "debug" ]; then
            echo "⚡ Building Debug APK..."
            flutter build apk --debug
          else
            echo "🚀 Building Release APK..."
            flutter build apk --release
          fi

      - name: Find & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: workspace/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
