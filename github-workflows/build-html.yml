name: Build HTML APK

on:
  push:
    branches:
      - 'build/html-**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack Project Payload & Detect Mode
        run: |
          BUILD_MODE="release"
          if [ -f "build-info.json" ]; then
            PARSED_MODE=$(jq -r '.buildMode // "release"' build-info.json)
            if [ -n "$PARSED_MODE" ] && [ "$PARSED_MODE" != "null" ]; then
              BUILD_MODE="$PARSED_MODE"
            fi
          fi
          echo "TARGET_BUILD_MODE=$BUILD_MODE" >> $GITHUB_ENV
          echo "Selected Build Mode: $BUILD_MODE"

          mkdir -p workspace
          unzip -q -o payload.zip -d workspace
          cd workspace
          ls -la

      - name: Compile WebView APK with Gradle
        working-directory: workspace
        run: |
          chmod +x ./gradlew || true
          if [ "${{ env.TARGET_BUILD_MODE }}" = "debug" ]; then
            echo "⚡ Building Debug APK..."
            ./gradlew assembleDebug || gradle assembleDebug
          else
            echo "🚀 Building Release APK..."
            ./gradlew assembleRelease || gradle assembleRelease
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-webview-apk
          path: workspace/app/build/outputs/apk/**/*.apk
          retention-days: 1
