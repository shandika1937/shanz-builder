name: Build HTML APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build Identifier'
        required: true
      release_tag:
        description: 'Release Tag with payload.zip'
        required: true
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'
      app_name:
        description: 'Application Name'
        required: false
        default: 'app'
  push:
    branches:
      - 'build/html-**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack Project Payload & Detect Mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p workspace

          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "📥 Downloading payload.zip from release ${{ inputs.release_tag }}..."
            gh release download "${{ inputs.release_tag }}" --pattern "payload.zip" --dir workspace
          elif [ -f "payload.zip" ]; then
            cp payload.zip workspace/
          fi

          cd workspace
          unzip -q -o payload.zip
          rm -f payload.zip
          ls -la

          TARGET_MODE="${{ inputs.build_type }}"
          if [ -z "$TARGET_MODE" ]; then
            TARGET_MODE="release"
          fi
          echo "TARGET_BUILD_MODE=$TARGET_MODE" >> $GITHUB_ENV

      - name: Compile WebView APK with Gradle
        working-directory: workspace
        run: |
          chmod +x ./gradlew || true
          if [ "${{ env.TARGET_BUILD_MODE }}" = "debug" ]; then
            echo "⚡ Building Debug APK..."
            ./gradlew assembleDebug || gradle assembleDebug
          else
            echo "🚀 Building Release APK..."
            ./gradlew assembleRelease || gradle assembleRelease
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-webview-apk
          path: workspace/app/build/outputs/apk/**/*.apk
          retention-days: 1
