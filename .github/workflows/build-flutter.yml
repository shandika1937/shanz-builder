name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build Identifier'
        required: true
      release_tag:
        description: 'Release Tag with payload.zip'
        required: true
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'
      app_name:
        description: 'Application Name'
        required: false
        default: 'app'
  push:
    branches:
      - 'build/flutter-**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Unpack Project Payload & Detect Mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p workspace

          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "📥 Downloading payload.zip from release ${{ inputs.release_tag }}..."
            gh release download "${{ inputs.release_tag }}" --pattern "payload.zip" --dir workspace
          elif [ -f "payload.zip" ]; then
            cp payload.zip workspace/
          fi

          cd workspace
          unzip -q -o payload.zip
          rm -f payload.zip

          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -print -quit)
          if [ -n "$PUBSPEC_PATH" ]; then
            SUBDIR=$(dirname "$PUBSPEC_PATH")
            if [ "$SUBDIR" != "." ]; then
              echo "Moving contents from $SUBDIR to workspace root"
              cp -a "$SUBDIR"/. .
              rm -rf "$SUBDIR"
            fi
          fi

          # Auto fix Gradle wrapper if exists
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-.*-all.zip/gradle-8.10.2-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-.*-bin.zip/gradle-8.10.2-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Files in workspace root:"
          ls -la

          TARGET_MODE="${{ inputs.build_type }}"
          if [ -z "$TARGET_MODE" ]; then
            TARGET_MODE="release"
          fi
          echo "TARGET_BUILD_MODE=$TARGET_MODE" >> $GITHUB_ENV

      - name: Compile Flutter APK
        working-directory: workspace
        run: |
          echo "📦 Running flutter pub get..."
          flutter pub get
          COMMON_FLAGS="--android-skip-build-dependency-validation"

          if [ "${{ env.TARGET_BUILD_MODE }}" = "debug" ]; then
            echo "⚡ Building Debug APK (Installable on all Android)..."
            flutter build apk --debug $COMMON_FLAGS
          else
            echo "🚀 Building Release APK..."
            flutter build apk --release $COMMON_FLAGS || (echo "⚠️ Release signing fallback, building installable debug APK..." && flutter build apk --debug $COMMON_FLAGS)
          fi

      - name: Find & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: workspace/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
