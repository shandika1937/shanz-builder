name: Build Flutter APK

on:
  push:
    branches:
      - 'build/flutter-**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unpack Project Payload & Detect Mode
        run: |
          BUILD_MODE="release"
          if [ -f "build-info.json" ]; then
            PARSED_MODE=$(jq -r '.buildMode // "release"' build-info.json)
            if [ -n "$PARSED_MODE" ] && [ "$PARSED_MODE" != "null" ]; then
              BUILD_MODE="$PARSED_MODE"
            fi
          fi
          echo "TARGET_BUILD_MODE=$BUILD_MODE" >> $GITHUB_ENV
          echo "Selected Build Mode: $BUILD_MODE"

          mkdir -p workspace
          unzip -q -o payload.zip -d workspace
          cd workspace
          if [ ! -f "pubspec.yaml" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving contents from $SUBDIR to workspace root"
              cp -r $SUBDIR/* . 2>/dev/null || true
            fi
          fi
          echo "Files in workspace:"
          ls -la

      - name: Compile Flutter APK
        working-directory: workspace
        run: |
          flutter pub get
          if [ "${{ env.TARGET_BUILD_MODE }}" = "debug" ]; then
            echo "⚡ Building Debug APK..."
            flutter build apk --debug
          else
            echo "🚀 Building Release APK..."
            flutter build apk --release
          fi

      - name: Find & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: workspace/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
